<!-- Insignia de Tixola: sartén crema sobre el rojo de marca (#9e1618), como el logotipo impreso.
     Elipse y mango en diagonal, es decir, la sartén VISTA DE LADO. A 16 px —que es el tamaño al
     que de verdad se ve un icono de pestaña— lo único que sobrevive de un dibujo es su silueta:
     un círculo de frente con el mango en horizontal se leía como una diana. Y el fondo es el rojo
     lleno y no el granate de la página, porque el contraste de la insignia lo da el color, no el
     trazo: oscuro sobre oscuro, a ese tamaño, es una mancha.
     Debe ir a juego con `Insignia` en src/components/ui/Logo.tsx (avatar del camarero virtual). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#9e1618"/>
  <g fill="none" stroke="#f6f4e7" stroke-linecap="round">
    <ellipse cx="25" cy="39" rx="16" ry="12" stroke-width="4"/>
    <path d="M36 30.5 L53 15" stroke-width="5"/>
  </g>
</svg>
