  <g font-family="Helvetica" fill="#111111" font-size="11">
    <text x="26"  y="76">La voz</text>
    <text x="26"  y="292">Vuestros tratamientos</text>
    <text x="350" y="76">Vuestras reglas</text>
    <text x="350" y="292">Vuestra pantalla</text>
  </g>
  <g font-family="Helvetica" fill="#6E6E6E" font-size="9.5">
    <text x="26"  y="94">Contesta como una persona,</text>
    <text x="26"  y="106">en castellano.</text>

    <text x="26"  y="310">Lo que hac&#233;is y c&#243;mo lo</text>
    <text x="26"  y="322">llam&#225;is.</text>

    <text x="350" y="94">Lo que puede y lo que no</text>
    <text x="350" y="106">puede decir.</text>

    <text x="350" y="310">El recado escrito, con</text>
    <text x="350" y="322">nombre, tel&#233;fono y la hora.</text>
  </g>

