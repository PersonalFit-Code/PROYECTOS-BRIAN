<title>Oferta de automatización telefónica para Arroutada</title>
<style>
  @page { size: A4; margin: 13mm 14mm; }

  :root {
    --negro: #111111;
    --gris:  #6E6E6E;
    --linea: #D8D8D8;
    --fino:  #EDEDED;
    --oro:   #A07D2C;
  }
  * { box-sizing: border-box; }
  html, body { background: #fff; }
  body {
    margin: 0; width: 182mm; height: 258mm;
    display: flex; flex-direction: column;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--negro); font-size: 9.6pt; line-height: 1.45;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  svg { display: block; }

  /* ---------------- cabecera ---------------- */
  .cabecera {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 8.2pt;
  }
  .cabecera .marca { font-weight: 800; letter-spacing: 3.4pt; text-transform: uppercase; }
  .cabecera .fecha { color: var(--gris); letter-spacing: .3pt; }

  /* ---------------- escena ---------------- */
  .escena { margin-top: 17mm; }
  .escena .rot {
    font-size: 2.5px; letter-spacing: .92px; font-weight: 600;
    fill: var(--gris); stroke: none;
  }

  /* ---------------- titular ---------------- */
  .titular {
    margin: 20mm 0 0; font-size: 35.5pt; font-weight: 800;
    line-height: 1.02; letter-spacing: -1.25pt;
  }
  .titular .dest { display: inline-block; border-bottom: 1.2pt solid var(--oro); padding-bottom: 1mm; }

  /* ---------------- bajada ---------------- */
  .bajada {
    margin: 10mm 0 0; max-width: 128mm;
    font-size: 13pt; line-height: 1.4; color: var(--gris);
  }

  .aire { flex: 1 1 auto; }

  /* ---------------- ficha ---------------- */
  .filete { display: flex; }
  .filete i { display: block; height: 0; }
  .filete .o { width: 20mm; border-top: 1pt solid var(--oro); }
  .filete .l { flex: 1; border-top: .5pt solid var(--linea); }
  .ficha {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 3.4mm; font-size: 9pt; color: var(--gris);
  }
  .ficha b { color: var(--negro); font-weight: 700; }
  .ficha .firma { text-align: right; white-space: nowrap; }
</style>
</head>
